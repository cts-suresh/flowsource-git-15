  description: >
    The customer authorises payment via an online form allowing the business
    to automatically collect funds when due.

  links:
    - title: Documentation
      url: https://backstage.io/docs

    - title: Backstage Website
      url: https://backstage.io/

    - title: Blackduck Website
      url: https://github.com/deepan10/backstage-plugin-blackduck

  annotations:
    jenkins-pipelines: fs-jira,testjenkins
    jenkins-pipelines-trigger: fs-jira,testjenkins
    jira-project-key: ISGFS
    durationInDays: '180'
    jira-storypoint-field: '#notapplicable'
    backstage.io/techdocs-ref: dir:.
    flowsource/github-repo-owner: cts-suresh
    flowsource/github-repo-name: flowsource-git-15
    flowsource/github-host: github.com

  tags:
    - payment
    - transaction

spec:
  type: service
  system: flowsource-demo
  owner: group:default/default-group
  lifecycle: development
